<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="build-version" content="2026-10-22-02">
<title>EPC and DEC pricing – CSR Sustain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* CSR Sustain hub style: teal #377679 and mint #AAE8D8 on white, silver working ground,
   coloured section bands, Source Serif headings, Figtree text */
:root{
  --teal:#377679; --teal-ink:#24575A; --deep:#1C4547; --mint:#AAE8D8; --mint-soft:#E3F4EF;
  --paper:#EEF1F4; --surface:#FFFFFF; --sunk:#F3F5F7; --line:#D3DEDC; --ink:#24575A; --muted:#4F7477;
  --sec-amber:#FDF1E2; --sec-blue:#E8F1FC; --sec-violet:#F1ECFD; --sec-green:#E5F5EE; --sec-slate:#EDF0F3; --sec-teal:#E0EEEF; --sec-rose:#FCEBEC;
  --bar-amber:#F2994A; --bar-blue:#2F80ED; --bar-violet:#8B5CF6; --bar-green:#20A884; --bar-slate:#64748B; --bar-teal:#377679; --bar-rose:#E5484D;
  --warn:#9A5B00; --bad:#B42318; --ok:#157F5B;
  --head:"Source Serif 4", Georgia, "Times New Roman", serif; --body:"Figtree", -apple-system, "Segoe UI", sans-serif;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 10px 26px -18px rgba(28,69,71,.45);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#2F6466; --surface:#285A5C; --sunk:#2E6366; --line:#4D8A8C; --ink:#FFFFFF; --muted:#CDEFE6; --teal-ink:#AAE8D8; --mint-soft:#24494A;
    --sec-amber:#40453A; --sec-blue:#2D4F66; --sec-violet:#3F4466; --sec-green:#2B5A52; --sec-slate:#33505A; --sec-teal:#285A5C; --sec-rose:#553F45;
    --warn:#FFD27A; --bad:#FFB4AB; --ok:#9BE5C4; color-scheme:dark;
  }
}
:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.55;}
h1,h2,h3{font-family:var(--head); font-weight:400; line-height:1.15; margin:0; color:var(--teal-ink);}
a{color:var(--teal);}
:focus-visible{outline:3px solid var(--mint); outline-offset:2px;}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
button,input,select,textarea{font:inherit; color:inherit;}

/* shell: sidebar + top bar, as in the hub */
.shell{display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh;}
.side{position:sticky; top:0; height:100vh; background:linear-gradient(180deg, #F7F8FA, #EEF1F4); border-right:1px solid var(--line); padding:0 12px 12px; display:flex; flex-direction:column;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .side{background:#2A5B5D;} }
.side-logo{padding:16px 6px 14px; border-bottom:1px solid var(--line); margin-bottom:6px;}
.side-logo img{height:34px; width:auto; display:block;}
.side-logo span{display:block; font-family:var(--head); font-size:16px; margin-top:8px; color:var(--teal-ink);}
.nav-l{margin:10px 10px 4px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); opacity:.75;}
.nav button{display:flex; width:100%; align-items:center; gap:10px; padding:9px 10px; border:0; border-radius:8px; background:none; color:var(--ink); font:inherit; font-weight:500; font-size:14.5px; text-align:left; cursor:pointer;}
.nav button svg{width:19px; height:19px; flex-shrink:0; opacity:.75;}
.nav button:hover{background:var(--sunk);}
.nav button[aria-current="page"]{background:var(--mint-soft); font-weight:700;}
.nb{margin-left:auto; font-size:11.5px; font-weight:700; color:#fff; background:var(--bar-amber); padding:1px 7px; border-radius:999px;}
.side-foot{margin-top:auto; border-top:1px solid var(--line); padding-top:10px; font-size:12px; color:var(--muted);}
.mode{display:block; padding:8px 10px; border-radius:8px; background:var(--surface); border:1px solid var(--line); margin-bottom:8px; line-height:1.4;}
.mode b{display:block; color:var(--ink);}
.main{min-width:0; display:flex; flex-direction:column;}
.top{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; min-height:62px; padding:8px 26px; background:var(--surface); border-bottom:1px solid var(--line);}
.top h1{font-family:var(--body); font-size:15px; font-weight:700; color:var(--ink);}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:14px;}
.who select{min-height:34px; border:1.5px solid var(--teal); border-radius:6px; background:var(--surface); padding:3px 8px;}
.av{width:32px; height:32px; border-radius:50%; display:grid; place-items:center; color:#fff; background:var(--teal); font-weight:700; font-size:12.5px; overflow:hidden;}
.av img{width:100%; height:100%; object-fit:cover;}
.menu-btn{display:none;}
.page{padding:22px 26px 80px; max-width:1420px; width:100%;}
@media (max-width:980px){
  .shell{grid-template-columns:1fr;}
  .side{position:fixed; z-index:40; left:0; width:250px; transform:translateX(-105%); transition:transform .2s; box-shadow:var(--shadow);}
  .shell.open .side{transform:none;}
  .menu-btn{display:grid; place-items:center; width:38px; height:38px; border-radius:8px; border:1px solid var(--line); background:var(--surface); cursor:pointer;}
  .top{padding:8px 14px;} .page{padding:16px 14px 80px;}
}

/* buttons, fields */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:40px; padding:0 16px; border-radius:999px; border:1.5px solid var(--teal); background:var(--surface); color:var(--teal-ink); font-weight:600; cursor:pointer; text-decoration:none; white-space:nowrap;}
.btn:hover{background:var(--mint-soft);}
.btn.primary{background:var(--teal); color:#fff;}
.btn.primary:hover{background:var(--deep); border-color:var(--deep);}
.btn.ok{background:var(--bar-green); border-color:var(--bar-green); color:#fff;}
.btn.danger{border-color:var(--bad); color:var(--bad);}
.btn.small{min-height:32px; padding:0 12px; font-size:13.5px;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}
.linkbtn{background:none; border:0; padding:0; color:var(--teal); text-decoration:underline; cursor:pointer; font-size:13.5px;}
.field{display:flex; flex-direction:column; gap:4px; margin-bottom:12px; min-width:0;}
.field label{font-size:13px; font-weight:600;}
.field input,.field select,.field textarea{min-height:40px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); width:100%;}
.field textarea{min-height:64px; resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 3px var(--mint-soft);}
.field input[disabled]{background:var(--sunk);}
.hint{font-size:12.5px; color:var(--muted);}
.num{text-align:right; font-variant-numeric:tabular-nums;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
.grid3{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:0 14px;}
.grid4{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:0 12px;}
@media (max-width:760px){ .grid2,.grid3{grid-template-columns:1fr;} .grid4{grid-template-columns:1fr 1fr;} }

/* coloured section boxes */
.box{background:var(--surface); border:1px solid color-mix(in srgb, var(--line) 70%, #94A3B8); border-radius:12px; margin-bottom:16px; box-shadow:0 1px 2px rgba(15,23,42,.04); border-top:3px solid var(--bar, var(--bar-teal));}
.box-h{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 18px; background:var(--sec, var(--sec-teal)); border-radius:9px 9px 0 0; border-bottom:1px solid var(--line);}
.box-h h2{font-family:var(--body); font-size:15.5px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:10px;}
.box-h .n{display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; background:var(--bar, var(--teal)); color:#fff; font-size:12.5px;}
.box-b{padding:16px 18px;}
.c-blue{--sec:var(--sec-blue); --bar:var(--bar-blue);} .c-green{--sec:var(--sec-green); --bar:var(--bar-green);} .c-amber{--sec:var(--sec-amber); --bar:var(--bar-amber);}
.c-violet{--sec:var(--sec-violet); --bar:var(--bar-violet);} .c-slate{--sec:var(--sec-slate); --bar:var(--bar-slate);} .c-teal{--sec:var(--sec-teal); --bar:var(--bar-teal);} .c-rose{--sec:var(--sec-rose); --bar:var(--bar-rose);}
.phead{display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
.phead h1{font-size:clamp(24px, 2.4vw, 30px);}
.phead p{margin:4px 0 0; color:var(--muted);}
.status{display:inline-block; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; vertical-align:middle; font-family:var(--body);}
.st-draft{background:#E2E8EA; color:#3D5557;} .st-awaiting{background:#FDF1E2; color:#9A5B00;} .st-approved{background:#DDF3E8; color:#157F5B;}
.st-rejected{background:#FCEBEC; color:#B42318;} .st-issued{background:var(--teal); color:#fff;}
.note{border-radius:8px; padding:9px 12px; font-size:13.5px; margin:0 0 12px; background:var(--sunk);}
.note.warn{background:var(--sec-amber); color:var(--warn);}
.note.bad{background:var(--sec-rose); color:var(--bad);}
.note.ok{background:var(--sec-green); color:var(--ok);}

/* quote layout */
.qgrid{display:grid; grid-template-columns:minmax(0,1fr) 390px; gap:20px; align-items:start;}
@media (max-width:1100px){ .qgrid{grid-template-columns:1fr;} }
.rows{display:grid; gap:12px;}
.row{border:1px solid var(--line); border-radius:10px; padding:12px 14px 2px; background:color-mix(in srgb, var(--sec-blue) 40%, var(--surface));}
.row-h{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.row-h b{font-size:14px;}
.calc{font-size:13.5px; color:var(--muted); margin:-4px 0 10px;}
.calc strong{color:var(--ink);}
.rowgrid{display:grid; grid-template-columns:2fr 1fr 1fr 1.4fr; gap:0 12px;}
@media (max-width:760px){ .rowgrid{grid-template-columns:1fr 1fr;} }
.addrow{margin-top:12px;}

/* travel */
.trip{display:grid; grid-template-columns:1fr; gap:14px; align-items:start;}
.map{position:relative; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#F4F9F8; aspect-ratio:16/9; box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);}
.map svg{width:100%; height:100%; display:block; touch-action:none; user-select:none;}
.zoom{position:absolute; right:12px; bottom:12px; display:grid; gap:4px;}
.zoom button{width:34px; height:34px; border-radius:8px; border:1px solid #CFE3DF; background:#fff; color:#24575A; font-size:18px; font-weight:700; cursor:pointer; box-shadow:0 2px 6px rgba(28,69,71,.15);}
.zoom button:hover{background:#E3F4EF;}
.zhint{position:absolute; left:50%; top:10px; transform:translateX(-50%); margin:0; font-size:12px; color:#3F6E70; background:rgba(255,255,255,.85); padding:3px 10px; border-radius:999px; pointer-events:none; opacity:0; transition:opacity .3s;}
.map:hover .zhint{opacity:1;}
.map .gl{position:absolute; inset:0;}
.legs{list-style:none; margin:0; padding:0; font-size:13.5px;}
.legs li{display:grid; grid-template-columns:22px 1fr auto; gap:8px; align-items:center; padding:7px 0; border-bottom:1px dashed var(--line);}
.legs li i{display:grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--teal); color:#fff; font-style:normal; font-size:11.5px; font-weight:700;}
.legs li i.s{background:var(--deep);}
.src{display:inline-flex; gap:6px; align-items:center; font-size:12.5px; font-weight:600; padding:3px 9px; border-radius:999px;}
.src.route{background:var(--sec-green); color:var(--ok);} .src.est{background:var(--sec-amber); color:var(--warn);} .src.man{background:var(--sec-violet); color:#5B3FA8;}
.row-acts{display:flex; gap:6px; align-items:center;}
.mv{width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--teal-ink); cursor:pointer; font-weight:700;}
.mv:hover:not([disabled]){border-color:var(--teal); background:var(--mint-soft);}
.mv[disabled]{opacity:.35; cursor:default;}
.order{border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:14px; background:color-mix(in srgb, var(--sec-green) 50%, var(--surface));}
.order-h{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px;}
.order ol{list-style:none; margin:0; padding:0;}
.order li{display:grid; grid-template-columns:26px 1fr 30px 30px; gap:8px; align-items:center; padding:5px 0; border-top:1px dashed var(--line); font-size:14px;}
.order li:first-child{border-top:0;}
.order .on{display:grid; place-items:center; width:24px; height:24px; border-radius:50%; background:var(--teal); color:#fff; font-size:12px; font-weight:700;}
.order small{color:var(--muted);}
.kpis{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; margin-bottom:16px;}
@media (max-width:900px){ .kpis{grid-template-columns:1fr 1fr;} }
.kpi{background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--bar); border-radius:12px; padding:12px 16px;}
.kpi span{display:block; font-size:13px; font-weight:600; color:var(--muted);}
.kpi b{display:block; font-family:var(--head); font-weight:400; font-size:28px; color:var(--teal-ink); line-height:1.2; margin:2px 0;}
.kpi small{color:var(--muted); font-size:12.5px;}
.k-green{--bar:var(--bar-green); background:color-mix(in srgb, var(--sec-green) 60%, var(--surface));} .k-amber{--bar:var(--bar-amber); background:color-mix(in srgb, var(--sec-amber) 60%, var(--surface));}
.k-rose{--bar:var(--bar-rose); background:color-mix(in srgb, var(--sec-rose) 60%, var(--surface));} .k-slate{--bar:var(--bar-slate); background:color-mix(in srgb, var(--sec-slate) 60%, var(--surface));}
.dash2{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:16px;}
@media (max-width:900px){ .dash2{grid-template-columns:1fr;} }
.bars{display:grid; grid-template-columns:repeat(6, 1fr); gap:12px; align-items:end; height:190px;}
.bar{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px;}
.bar i{display:block; width:70%; max-width:56px; border-radius:6px 6px 2px 2px; background:linear-gradient(180deg, #20A884, #377679);}
.bv{font-size:11.5px; font-weight:700; color:var(--teal-ink);} .bl{font-size:12px; color:var(--muted);}
.big{font-family:var(--head); font-size:42px; color:var(--teal-ink); margin:0;}
.board{display:grid; grid-template-columns:repeat(5, minmax(180px,1fr)); gap:10px; padding:14px; overflow-x:auto;}
.col{background:var(--sec); border-radius:10px; padding:8px; border-top:3px solid var(--bar); min-height:120px;}
.col-h{display:flex; flex-direction:column; padding:2px 4px 8px; font-size:13px;} .col-h span{color:var(--muted); font-size:12px;}
.qcard{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:6px; cursor:pointer; font:inherit; color:var(--ink);}
.qcard:hover{border-color:var(--teal);}
.qcard b{display:block; font-size:13.5px;} .qcard span{display:block; font-size:12px; color:var(--muted);} .qcard .qv{font-weight:700; color:var(--teal-ink); font-size:13px;}
.signin{max-width:480px; margin:6vh auto 0;}
.scopebox{border:1px solid var(--line); border-radius:8px; padding:8px 12px; background:var(--sunk); font-size:14px;}
.scopebox summary{cursor:pointer; font-weight:600;}
.splitsw{display:flex; gap:8px; align-items:flex-start; font-size:13.5px; margin:-2px 0 10px; cursor:pointer;}
.splitsw input{margin-top:3px;}
.split{border:1px dashed var(--teal); border-radius:10px; padding:10px 12px; margin:0 0 12px; background:var(--surface);}
.split-h{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
.seg{display:inline-flex; border:1.5px solid var(--teal); border-radius:999px; overflow:hidden;}
.seg button{border:0; background:var(--surface); color:var(--teal-ink); padding:5px 12px; font:inherit; font-size:13px; font-weight:600; cursor:pointer;}
.seg button[aria-pressed="true"]{background:var(--teal); color:#fff;}
.split .tbl td{padding:5px 8px;} .split .tbl select{min-width:160px;}
.split-f{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px;}
.split-sum{margin-left:auto; font-size:13px; font-weight:700; padding:3px 10px; border-radius:999px;}
.split-sum.ok{background:var(--sec-green); color:var(--ok);} .split-sum.bad{background:var(--sec-rose); color:var(--bad);}
.row.exp{background:color-mix(in srgb, var(--sec-rose) 35%, var(--surface));}
.expgrid{display:grid; grid-template-columns:1.1fr 2fr .8fr .9fr .8fr auto; gap:0 10px; align-items:end;}
@media (max-width:860px){ .expgrid{grid-template-columns:1fr 1fr;} }
.exp-amt{min-height:40px; display:flex; align-items:center; font-weight:700; font-variant-numeric:tabular-nums;}
.subh{font-family:var(--body); font-size:14px; font-weight:700; color:var(--ink); margin:6px 0 10px; padding-top:12px; border-top:1px solid var(--line);}
.bgrid{display:grid; grid-template-columns:2fr 1fr 1fr 1.1fr 1.6fr 1fr; gap:0 10px;}
@media (max-width:1250px){ .bgrid{grid-template-columns:repeat(3, minmax(0,1fr));} }
@media (max-width:640px){ .bgrid{grid-template-columns:1fr 1fr;} }
.row-opts{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; margin:-2px 0 10px;}
.row-opts .splitsw{margin:0;}
.ov{display:inline-flex; gap:6px; align-items:center; font-size:13px;}
.ov input{min-height:32px; border:1px solid var(--line); border-radius:6px; padding:3px 8px; width:110px; background:var(--surface);}
.ov input + label + input, .ov input[data-l="reason"]{width:200px;}
.clienttag{margin:2px 0 12px;}
.ac-list{list-style:none; margin:0; padding:4px; z-index:80; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 30px -10px rgba(0,0,0,.3); max-height:320px; overflow:auto;}
.ac-list li{padding:8px 10px; border-radius:8px; cursor:pointer; display:grid; gap:1px;}
.ac-list li:hover, .ac-list li[aria-selected="true"]{background:var(--mint-soft);}
.ac-list li span{font-size:13px; color:var(--muted);} .ac-list li small{font-size:12px; color:var(--teal);}
.gbox{border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:12px; background:var(--sunk);}
.dhead{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px;}
.dhead h1{font-size:clamp(24px, 2.4vw, 30px);} .dhead p{margin:4px 0 0; color:var(--muted);}
.dhead-r{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.stats{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; margin-bottom:18px;}
@media (max-width:1000px){ .stats{grid-template-columns:1fr 1fr;} }
.stat{display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:0 1px 2px rgba(15,23,42,.04);}
.stat-ic{display:grid; place-items:center; width:38px; height:38px; border-radius:10px; flex-shrink:0;}
.stat-ic svg{width:20px; height:20px;}
.stat-l{display:block; font-size:13px; color:var(--muted); font-weight:600;}
.stat b{display:block; font-family:var(--head); font-weight:400; font-size:26px; line-height:1.2; color:var(--teal-ink);}
.stat small{font-size:12.5px; color:var(--muted);}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-bottom:16px; box-shadow:0 1px 2px rgba(15,23,42,.04); overflow:hidden;}
.panel-h{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:14px 16px 10px;}
.panel-h h2{font-family:var(--body); font-size:15.5px; font-weight:700; color:var(--ink);}
.todo{list-style:none; margin:0; padding:0 8px 8px;}
.todo li{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 10px; border-radius:10px; border-left:4px solid var(--bar-slate); margin-bottom:6px; background:var(--sunk);}
.todo li.t-awaiting{border-left-color:var(--bar-amber);} .todo li.t-rejected{border-left-color:var(--bar-rose);} .todo li.t-approved{border-left-color:var(--bar-green);}
.t-main{min-width:0;} .t-main small{display:block; font-size:13px; color:var(--ink); margin-top:2px;}
.t-acts{display:flex; gap:6px; flex-wrap:wrap;}
.dgrid{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:start;}
@media (max-width:1100px){ .dgrid{grid-template-columns:1fr;} }
.pbar{display:flex; height:10px; border-radius:999px; overflow:hidden; margin:0 16px 12px; gap:2px; background:var(--sunk);}
.ptabs{display:flex; gap:4px; flex-wrap:wrap; padding:0 12px; border-bottom:1px solid var(--line);}
.ptabs button{display:inline-flex; align-items:center; gap:6px; border:0; background:none; padding:9px 10px; font:inherit; font-size:13.5px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
.ptabs button[aria-selected="true"]{color:var(--ink); font-weight:700; border-bottom-color:var(--teal);}
.ptabs i{width:8px; height:8px; border-radius:50%;} .ptabs b{font-size:12px; background:var(--sunk); padding:0 7px; border-radius:999px; color:var(--muted);}
.psearch{padding:10px 16px;} .psearch input{width:100%; min-height:38px; border:1px solid var(--line); border-radius:8px; padding:6px 12px; background:var(--surface);}
.qlist{list-style:none; margin:0; padding:0 8px 8px;}
.qlist button{width:100%; display:grid; grid-template-columns:minmax(0,1fr) auto auto 110px; gap:14px; align-items:center; text-align:left; border:0; background:none; padding:10px; border-radius:10px; font:inherit; color:var(--ink); cursor:pointer;}
.qlist li + li{border-top:1px solid var(--line);}
.qlist button:hover{background:var(--sunk);}
.ql-main b{display:block; font-size:14.5px;} .ql-main small{display:block; color:var(--muted); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ql-date{font-size:13px; color:var(--muted); white-space:nowrap;} .ql-v{font-weight:700; text-align:right; font-variant-numeric:tabular-nums;}
@media (max-width:700px){ .qlist button{grid-template-columns:1fr auto;} .ql-date{display:none;} }
.bars.sm{height:150px; padding:0 16px 14px;}
.feed{list-style:none; margin:0; padding:0 8px 10px;}
.feed button{display:block; width:100%; text-align:left; border:0; background:none; padding:8px; border-radius:8px; font:inherit; font-size:13.5px; color:var(--ink); cursor:pointer;}
.feed button:hover{background:var(--sunk);} .feed span{color:var(--muted);} .feed small{display:block; color:var(--muted); font-size:12px;}
.dlg.big{width:min(1400px, 96vw); height:90vh; display:flex; flex-direction:column;}
.dlg.big iframe{flex:1; width:100%; border:0; border-top:1px solid var(--line); border-radius:0 0 14px 14px; background:#0F1620;}
.scrim.measure{padding:4vh 2vw; align-items:center;}
.ms-tip{margin:0; padding:6px 18px;}
.areafrom{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; margin:-2px 0 10px;}
.af-l{font-size:13px; font-weight:600;}
.areafrom .hint{flex:1 1 260px;}
.dlg.wide{width:min(920px, 96vw);}
.ep-search{display:flex; gap:8px; margin-bottom:12px;} .ep-search input{flex:1; min-height:40px; border:1px solid var(--line); border-radius:8px; padding:6px 12px; background:var(--surface);}
.epcdlg .tbl-wrap{max-height:56vh; overflow:auto;}
.band{display:inline-grid; place-items:center; min-width:26px; height:22px; padding:0 6px; border-radius:4px; color:#fff; font-weight:700; font-size:12.5px;}
.b-Ap,.b-A{background:#008054;} .b-B{background:#19b459;} .b-C{background:#8dce46;color:#1b1b1b;} .b-D{background:#ffd500;color:#1b1b1b;} .b-E{background:#fcaa65;color:#1b1b1b;} .b-F{background:#ef8023;} .b-G{background:#e9153b;}
.journey{border:1px solid var(--line); border-radius:10px; padding:10px 12px 0; margin-top:10px; background:var(--surface);}

/* ledger */
.ledger{position:sticky; top:78px; background:var(--deep); color:#fff; border-radius:16px; overflow:hidden; box-shadow:0 18px 40px -22px rgba(0,0,0,.6);}
.ledger-h{padding:16px 20px 12px; border-bottom:1px solid rgba(255,255,255,.15);}
.ledger-h span{display:block; color:var(--mint); font-size:13px;}
.ledger-h strong{font-family:var(--head); font-size:22px; font-weight:400;}
.lines{padding:8px 20px 4px; margin:0; list-style:none;}
.lines li{display:grid; grid-template-columns:1fr auto; gap:10px; padding:7px 0; border-bottom:1px dashed rgba(170,232,216,.25); font-size:14px;}
.lines li small{display:block; color:#B8D9D2; font-size:12.5px;}
.lines li .num{font-weight:600;}
.lines li.sub{border-bottom:1px solid rgba(255,255,255,.3); font-weight:700;}
.lines li.disc .num{color:var(--mint);}
.lines li.missing .num{color:#FFC27A;}
.total{display:flex; justify-content:space-between; align-items:baseline; padding:14px 20px; background:var(--teal);}
.total span{font-size:14px; color:#E6F6F1;}
.total strong{font-family:var(--head); font-size:34px; font-weight:400; font-variant-numeric:tabular-nums;}
.ledger-f{padding:14px 20px 18px; display:grid; gap:8px;}
.ledger-f .btn{width:100%; border-color:var(--mint); color:var(--deep); background:var(--mint);}
.ledger-f .btn:hover{background:#fff;}
.ledger-f .btn.ghost{background:transparent; color:#fff; border-color:rgba(255,255,255,.5);}
.ledger-note{font-size:12.5px; color:#B8D9D2; margin:0;}

/* tables, approvals */
.tbl-wrap{overflow-x:auto;}
table.tbl{width:100%; border-collapse:collapse; font-size:14px;}
.tbl th{text-align:left; font-size:13px; padding:9px 10px; border-bottom:2px solid var(--line); white-space:nowrap; background:var(--sunk);}
.tbl td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
.tbl input,.tbl select{min-height:36px; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--surface); width:100%;}
.tbl input.num{max-width:130px;}
.tbl tbody tr:nth-child(even) td{background:color-mix(in srgb, var(--sunk) 60%, var(--surface));}
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
.toolbar input{flex:1; min-width:220px; min-height:40px; padding:7px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface);}
.empty{padding:28px; text-align:center; color:var(--muted);}
.empty strong{display:block; color:var(--ink); font-size:16px; margin-bottom:4px;}
.acard{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; padding:16px 18px; border-bottom:1px solid var(--line);}
.acard:last-child{border-bottom:0;}
@media (max-width:900px){ .acard{grid-template-columns:1fr;} }
.acard h3{font-family:var(--body); font-size:16px; font-weight:700; color:var(--ink);}
.acard .meta{color:var(--muted); font-size:13.5px; margin:2px 0 8px;}
.mini-lines{list-style:none; padding:0; margin:0; font-size:13.5px;}
.mini-lines li{display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-bottom:1px dashed var(--line);}
.mini-lines li.tot{font-weight:700; border-bottom:0; font-size:15px; padding-top:6px;}
.decide textarea{width:100%; min-height:70px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--surface);}
.decide .btns{display:flex; gap:8px; margin-top:8px;}
.timeline{list-style:none; margin:10px 0 0; padding:0; font-size:13.5px;}
.timeline li{padding:6px 0; border-top:1px solid var(--line); display:grid; grid-template-columns:140px 1fr; gap:10px;}
.timeline li span{color:var(--muted);}

/* dialog, toast */
.scrim{position:fixed; inset:0; z-index:60; background:rgba(10,30,30,.5); display:flex; align-items:flex-start; justify-content:center; padding:6vh 16px; overflow:auto;}
.dlg{background:var(--surface); color:var(--ink); border-radius:14px; width:min(560px,100%); box-shadow:0 24px 60px rgba(0,0,0,.35);}
.dlg-h{display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line);}
.dlg-h h2{font-family:var(--body); font-size:17px; font-weight:700; color:var(--ink);}
.dlg-b{padding:16px 18px;}
.dlg-f{display:flex; justify-content:flex-end; gap:10px; padding:12px 18px; border-top:1px solid var(--line);}
.x{background:none; border:0; font-size:26px; line-height:1; cursor:pointer; color:var(--muted);}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--deep); color:#fff; padding:11px 18px; border-radius:10px; z-index:70; font-size:14.5px; box-shadow:0 8px 24px rgba(0,0,0,.3);}
.pdfprev{width:100%; height:78vh; border:1px solid var(--line); border-radius:10px; background:#fff;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>

/* ============================================================
   CSR Sustain – EPC and DEC pricing, version 2
   Pricing rules (confirmed):
     floor-area charge = floor area (m²) × card rate for the property type
     mileage           = return miles × £0.55
     travel time       = return hours × £40
     quantity discount = % off the whole subtotal, travel included (thresholds to be confirmed)
     no minimum fee; Gary or Luke approves (or rejects) before a quotation is issued
   Two ways of running:
     shared – opened from the CSR Sustain Claude link: quotes, rate card and approvals are shared
              by the whole team (claude.ai artifact database) and people are really signed in
     local  – opened from a file or another website: everything stays in this browser
   ============================================================ */

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const gbp = n => "£" + r2(n).toLocaleString("en-GB", {minimumFractionDigits:2, maximumFractionDigits:2});
const num = v => { if(v === null || v === undefined || v === "") return null; const n = parseFloat(String(v).replace(/,/g, "")); return isFinite(n) ? n : null; };
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fmtD = s => s ? new Date(s.length === 10 ? s + "T12:00:00" : s).toLocaleDateString("en-GB", {day:"numeric", month:"long", year:"numeric"}) : "–";
const fmtDT = s => s ? new Date(s).toLocaleString("en-GB", {day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"}) : "–";
const addDays = (d, n) => { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
const hm = h => { const m = Math.round(h * 60); return Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0") + " min"; };
const nowISO = () => new Date().toISOString();
let toastT = null;
function toast(msg){ $$(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2800); }

function mergeSettings(d){
  const base = defaultSettings(), out = Object.assign({}, base, d);
  ["lodgement","rounding","programme","scope","deliverables","travelAdj","travel","discount","vat","google"].forEach(k => { out[k] = Object.assign({}, base[k], d[k] || {}); });
  out.rates = (d.rates || base.rates).map(r => Object.assign({epc5:"", mees:""}, r));
  ["scope","deliverables"].forEach(k => { out[k] = Object.assign({}, base[k], d[k] || {}); });
  out.team = d.team || [];
  return out;
}
let SETTINGS = defaultSettings();
let QUOTES = [];
const S = () => SETTINGS;

/* ---------- storage: shared database when available, otherwise this browser ---------- */
const STORE = {
  mode:"local", db:null, user:null, me:null, canEdit:false, unsubs:[],
  async init(onChange){
    // local first, so the page works immediately
    try{ const d = JSON.parse(localStorage.getItem(LOCAL_KEY)); if(d && d.settings){ SETTINGS = mergeSettings(d.settings); QUOTES = (d.quotes || []).map(normQuote); } }catch(e){}
    onChange();
    if(!(window.claude && window.claude.use)) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db) return;
    STORE.db = db; STORE.user = user; STORE.mode = "shared";
    if(user){ try{ STORE.me = await user.me(); STORE.canEdit = await user.canEdit(); }catch(e){} }
    STORE.unsubs.push(db.doc("config/settings").onSnapshot(snap => {
      const d = snap.data();
      if(d && d.rates){ SETTINGS = mergeSettings(d); }
      else if(STORE.canEdit && !STORE.seeded){ STORE.seeded = true; db.doc("config/settings").set(SETTINGS).catch(() => {}); }
      onChange("settings");
    }, () => {}));
    STORE.unsubs.push(db.collection("quotes").onSnapshot(snap => {
      QUOTES = snap.docs.map(d => d.data()).filter(Boolean).map(normQuote).sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
      onChange("quotes");
    }, () => {}));
  },
  saveLocal(){ try{ localStorage.setItem(LOCAL_KEY, JSON.stringify({settings:SETTINGS, quotes:QUOTES})); }catch(e){ toast("Couldn't save – browser storage is full or blocked."); } },
  async saveSettings(){
    if(STORE.mode === "shared"){
      if(!STORE.canEdit){ toast("Only editors of this tool can change the rate card."); return false; }
      try{ await STORE.db.doc("config/settings").set(JSON.parse(JSON.stringify(SETTINGS))); return true; }catch(e){ toast("Couldn't save the settings (" + (e.code || "error") + ")."); return false; }
    }
    STORE.saveLocal(); return true;
  },
  async saveQuote(q){
    q.updatedAt = nowISO();
    const clean = JSON.parse(JSON.stringify(q));
    const i = QUOTES.findIndex(x => x.id === q.id); if(i < 0) QUOTES.unshift(clean); else QUOTES[i] = clean;
    if(STORE.mode === "shared"){
      try{ await STORE.db.collection("quotes").doc(q.id).set(clean); return true; }catch(e){ toast("Couldn't save the quote (" + (e.code || "error") + ")."); return false; }
    }
    STORE.saveLocal(); return true;
  },
  async deleteQuote(id){
    QUOTES = QUOTES.filter(x => x.id !== id);
    if(STORE.mode === "shared"){ try{ await STORE.db.collection("quotes").doc(id).delete(); }catch(e){ toast("Couldn't delete (" + (e.code || "error") + ")."); } }
    else STORE.saveLocal();
  }
};

/* ---------- the quote model ---------- */
const newLine = () => ({id:uid(), site:"", postcode:"", cert:"EPC", typeId:"", level:"", area:"", override:"", reason:"", split:{on:false, mode:"pct", parts:[]}});
const newPart = (typeId = "", value = "") => ({id:uid(), typeId, value});
const EXPENSE_TYPES = ["Accommodation","Meals","Parking","Other"];
const newExpense = (type = "Accommodation") => ({id:uid(), type, desc:"", qty:"1", unit:""});
function newQuote(){
  return {id:uid(), ref:"", date:today(), preparedBy:STAFF.includes(ME.name()) ? ME.name() : "", client:{org:"", contact:"", email:"", phone:"", address:""},
    programme:{surveyDays:S().programme.surveyDays, reportDays:S().programme.reportDays, note:""},
    lines:[newLine()], expenses:[], travel:{start:S().travel.base, startLabel:S().travel.baseLabel, mode:S().travel.mode, result:null, manual:false, manualMiles:"", manualHours:"", manualMins:"", manualNote:""},
    discountMode:"auto", manualPct:"", manualReason:"", notes:"", status:"draft", approval:null, rejection:null, history:[], createdAt:nowISO(), updatedAt:nowISO(), saved:false};
}
function refFor(){ const d = new Date(); return (S().prefix || "Q") + "-" + String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") + "-" + Math.random().toString(36).slice(2, 5).toUpperCase(); }
/* bring a quote saved by an earlier version up to the current shape */
function normQuote(q){
  const n = newQuote();
  q.client = Object.assign({}, n.client, q.client || {});
  q.programme = Object.assign({}, n.programme, q.programme || {});
  q.travel = Object.assign({}, n.travel, q.travel || {});
  q.lines = (q.lines && q.lines.length ? q.lines : n.lines).map(l => { const x = Object.assign(newLine(), l); x.split = Object.assign({on:false, mode:"pct", parts:[]}, l.split || {}); return x; });
  q.expenses = q.expenses || [];
  q.history = q.history || []; q.status = q.status || "draft";
  ["discountMode","manualPct","manualReason","notes"].forEach(k => { if(q[k] === undefined) q[k] = n[k]; });
  return q;
}
const log = (q, text) => q.history.push({at:nowISO(), by:ME.name() || "", text});

/* ---------- pricing ---------- */
function rateFor(line){
  const t = S().rates.find(r => r.id === line.typeId);
  const col = line.cert === "DEC" ? "dec" : line.cert === "MEES" ? "mees" : (line.level === "5" ? "epc5" : "epc");
  const card = t ? num(t[col]) : null;
  const ov = num(line.override);
  return {card, rate:ov !== null ? ov : card, overridden:ov !== null, type:t, col};
}
function discountFor(q){
  const d = S().discount;
  if(q.discountMode === "manual"){ const p = num(q.manualPct); return {pct:p || 0, label:p ? "Discount (" + p + "%)" : "No discount", source:"manual"}; }
  const count = d.basis === "certificates" ? q.lines.length : new Set(q.lines.map(l => (l.postcode || l.site).toLowerCase().replace(/\s+/g, ""))).size;
  const what = count + " " + (d.basis === "certificates" ? "certificate" : "building") + (count === 1 ? "" : "s");
  if(!d.tiers.length) return {pct:0, label:"Quantity discount – not set up yet", source:"unset"};
  const tier = d.tiers.filter(t => num(t.min) !== null && count >= num(t.min)).sort((a, b) => num(b.min) - num(a.min))[0];
  return tier ? {pct:num(tier.pct) || 0, label:"Quantity discount (" + what + ", " + num(tier.pct) + "%)", source:"auto"} : {pct:0, label:"No quantity discount (" + what + ")", source:"auto"};
}
/* travel figures used for pricing: the calculated route, or manual figures with a note */
function travelFigures(q){
  const t = q.travel;
  if(t.manual) return {miles:num(t.manualMiles) || 0, hours:(num(t.manualHours) || 0) + (num(t.manualMins) || 0) / 60, source:"manual"};
  if(t.result) return {miles:t.result.miles, hours:t.result.hours, source:t.result.source};
  return {miles:0, hours:0, source:"none"};
}
/* a building used for several activities: each part is its share of the floor area at that activity's card rate.
   Shares are entered as percentages (estimated split) or as floor areas (measured split). */
function splitParts(l){
  if(!l.split || !l.split.on) return null;
  const total = num(l.area) || 0, mode = l.split.mode;
  const col = l.cert === "DEC" ? "dec" : l.cert === "MEES" ? "mees" : (l.level === "5" ? "epc5" : "epc");
  const parts = (l.split.parts || []).map(p => {
    const v = num(p.value) || 0, t = S().rates.find(r => r.id === p.typeId);
    const area = mode === "pct" ? total * v / 100 : v;
    const rate = t ? num(t[col]) : null;
    return {p, type:t, rate, area:Math.round(area * 100) / 100, pct:total ? Math.round((mode === "pct" ? v : v / total * 100) * 10) / 10 : 0, charge:rate !== null ? r2(area * rate) : 0};
  });
  const sum = mode === "pct" ? parts.reduce((t, x) => t + (num(x.p.value) || 0), 0) : parts.reduce((t, x) => t + x.area, 0);
  const target = mode === "pct" ? 100 : total;
  return {mode, parts, sum:Math.round(sum * 100) / 100, target, balanced:Math.abs(sum - target) < (mode === "pct" ? 0.05 : 0.5), col};

/* ---------- existing EPCs: the register files sit in a folder next to this page ----------
   epc-data/<postcode district>.json, e.g. epc-data/BL9.json. Only address, rating, floor area and expiry are shown. */
const EPC = {files:null, cache:{}};
const epcExpiry = r => { const d = new Date((r.lodgementDate || r.inspectionDate) + "T12:00:00"); d.setFullYear(d.getFullYear() + 10); return d.toISOString().slice(0, 10); };   // a non-domestic EPC lasts 10 years
async function epcDistrict(outcode){
  outcode = outcode.toUpperCase();
  if(EPC.cache[outcode]) return EPC.cache[outcode];
  let data = null;
  if(EPC.files){
    const f = EPC.files.get(outcode + ".json");
    if(!f) return (EPC.cache[outcode] = []);
    data = JSON.parse(await f.text());
  } else {
    try{
      const res = await withTimeout(fetch((S().epcFolder || "epc-data").replace(/\/$/, "") + "/" + encodeURIComponent(outcode) + ".json"), 8000);
      if(res.status === 404){ const probe = await fetch((S().epcFolder || "epc-data").replace(/\/$/, "") + "/_meta.json").catch(() => null); if(probe && probe.ok) return (EPC.cache[outcode] = []); throw new Error("nofolder"); }
      if(!res.ok) throw new Error("nofolder");
      data = await res.json();
    }catch(e){ const err = new Error("nofolder"); err.needFolder = true; throw err; }
  }
  return (EPC.cache[outcode] = (data && data.results || []).map(r => ({lmk:r.lmk, address:r.address, postcode:r.postcode, band:r.band, rating:r.assetRating, area:r.floorArea, lodged:r.lodgementDate, expiry:epcExpiry(r)})));
}
let EPCQ = {line:null, q:""};
function epcFind(lineId){
  const l = Q.lines.find(x => x.id === lineId); if(!l) return;

    <div id="ep-res" aria-live="polite"></div></div></div>`;

async function epcSearch(sc){
  const box = $("#ep-res", sc), raw = EPCQ.q.trim();
  const m = raw.toUpperCase().match(/\b([A-Z]{1,2}\d[A-Z\d]?)\s*(\d[A-Z]{2})?\b/);
  if(!m){ box.innerHTML = `<p class="hint">Enter a postcode (or at least the first part, like BL9) and, optionally, words from the address.</p>`; return; }
  const outcode = m[1], full = m[2] ? outcode + " " + m[2] : null;
  const words = raw.toUpperCase().replace(m[0], " ").split(/[\s,]+/).filter(w => w.length > 1);
  box.innerHTML = `<p class="hint">Searching ${esc(outcode)}…</p>`;
  let list;
  try{ list = await epcDistrict(outcode); }
  catch(e){
    box.innerHTML = `<div class="note warn"><b>The EPC files couldn't be opened from this page.</b><br>Put the <b>${esc(S().epcFolder || "epc-data")}</b> folder next to this page, or choose it now (it stays on your computer):
      <div style="margin-top:8px"><label class="btn small" for="ep-dir">Choose the EPC folder</label><input id="ep-dir" type="file" webkitdirectory directory multiple class="sr"></div></div>`;
    $("#ep-dir", sc).onchange = ev => { const files = [...ev.target.files]; if(!files.length) return; EPC.files = new Map(files.filter(f => /\.json$/i.test(f.name)).map(f => [f.name.toUpperCase().replace(".JSON", ".json"), f])); EPC.cache = {}; toast(EPC.files.size.toLocaleString("en-GB") + " EPC files ready."); epcSearch(sc); };
    return;
  }
  let hits = list.filter(r => (!full || r.postcode.toUpperCase() === full) && words.every(w => (r.address + " " + r.postcode).toUpperCase().includes(w)));
  hits.sort((a, b) => String(b.lodged).localeCompare(String(a.lodged)));
  const more = hits.length > 60; hits = hits.slice(0, 60);
  box.innerHTML = hits.length ? `<p class="hint" style="margin-top:0">${more ? "Showing the 60 newest of many – add words from the address to narrow it down." : hits.length + " certificate" + (hits.length === 1 ? "" : "s") + " found, newest first."}</p>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Address</th><th>EPC rating</th><th class="num">Floor area</th><th>Expiry date</th><th></th></tr></thead><tbody>
    ${hits.map((r, i) => { const exp = r.expiry < today(); return `<tr><td>${esc(r.address)}<br><small class="hint">${esc(r.postcode)}</small></td><td><span class="band b-${esc(String(r.band).replace("+", "p"))}">${esc(r.band)}</span> ${esc(r.rating)}</td><td class="num">${Number(r.area).toLocaleString("en-GB")} m²</td><td>${fmtD(r.expiry)}${exp ? ` <span class="status st-rejected">Expired</span>` : ""}</td><td><button class="btn small" data-epcuse="${i}">Use</button></td></tr>`; }).join("")}
    </tbody></table></div>` : `<p class="hint">No certificates found for ${esc(raw)}. Check the postcode, or try just the first part (e.g. ${esc(outcode)}) with a word from the address.</p>`;
  $$("[data-epcuse]", box).forEach(b => b.onclick = () => {
    const r = hits[Number(b.dataset.epcuse)], l = Q.lines.find(x => x.id === EPCQ.line); if(!l || !r) return;
    l.area = String(Math.round(r.area)); l.areaFrom = "epc"; l.epc = {lmk:r.lmk, address:r.address + ", " + r.postcode, band:r.band, rating:r.rating, area:Math.round(r.area), expiry:r.expiry};
    if(!l.postcode) l.postcode = r.postcode;
    touched(); sc._close(); keepFocus(viewQuote); scheduleTravel(); autosave();
    toast("Floor area " + Math.round(r.area).toLocaleString("en-GB") + " m² taken from the existing EPC.");
  });
}

/* ---------- clients: built from saved quotes, so every quoted client is remembered ---------- */
const ckey = c => String((c && (c.org || c.contact)) || "").trim().toLowerCase().replace(/\s+/g, " ");
function clientDirectory(){
  const map = new Map();
  QUOTES.slice().sort((a, b) => String(a.updatedAt).localeCompare(String(b.updatedAt))).forEach(q => {
    const k = ckey(q.client); if(!k) return;
    const c = map.get(k) || {key:k, quotes:[]};
    Object.assign(c, {org:q.client.org || c.org || "", contact:q.client.contact || c.contact || "", email:q.client.email || c.email || "", phone:q.client.phone || c.phone || "", address:q.client.address || c.address || ""});
    c.quotes.push(q); map.set(k, c);
  });
  return [...map.values()].map(c => { c.quotes.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    c.won = c.quotes.filter(q => ["approved","issued"].includes(q.status)); c.wonValue = c.won.reduce((t, q) => t + netOf(q), 0); c.last = c.quotes[0] && c.quotes[0].date; return c; })
    .sort((a, b) => (a.org || a.contact).localeCompare(b.org || b.contact));
}
function clientMatch(q){ const k = ckey(q.client); if(!k) return null; const c = clientDirectory().find(x => x.key === k); if(!c) return null; const others = c.quotes.filter(x => x.id !== q.id); return others.length ? Object.assign({}, c, {others}) : null; }
function clientTag(c){
  return c ? `<p class="note ok clienttag"><b>Existing client</b> – ${c.others.length} earlier quote${c.others.length === 1 ? "" : "s"}, the last on ${fmtD(c.others[0].date)}. <button class="linkbtn" data-act="openclient" data-key="${esc(c.key)}">View client</button></p>` : "";
}
const servicesOf = q => { const n = {}; q.lines.forEach(l => { const k = l.cert === "EPC" && l.level === "5" ? "EPC (level 5)" : l.cert; n[k] = (n[k] || 0) + 1; }); return Object.entries(n).map(([k, v]) => (v > 1 ? v + " × " : "") + k).join(", "); };
/* suggestions as you type the organisation or contact name */
function bindClientSuggest(){
  const list = $("#ac-list"); if(!list) return;
  let active = -1, items = [], input = null;
  const close = () => { list.hidden = true; active = -1; if(input) input.setAttribute("aria-expanded", "false"); };
  const show = el => {
    input = el; const q = el.value.trim().toLowerCase(); if(q.length < 2){ close(); return; }
    items = clientDirectory().filter(c => (c.org + " " + c.contact).toLowerCase().includes(q)).slice(0, 6);
    if(!items.length){ close(); return; }
    const r = el.getBoundingClientRect();
    list.style.cssText = `position:fixed; left:${r.left}px; top:${r.bottom + 4}px; width:${Math.max(r.width, 320)}px;`;
    list.innerHTML = items.map((c, i) => `<li role="option" id="ac-${i}" data-i="${i}"><b>${esc(c.org || c.contact)}</b><span>${esc([c.org ? c.contact : "", c.email].filter(Boolean).join(" · "))}</span><small>${c.quotes.length} quote${c.quotes.length === 1 ? "" : "s"} · last ${fmtD(c.last)}</small></li>`).join("");
    list.hidden = false; el.setAttribute("aria-expanded", "true");
  };
  const pick = i => { const c = items[i]; if(!c) return;
    // update the boxes first: re-drawing the form can fire a "change" from the box being typed in
    [["#f-corg", c.org], ["#f-ccontact", c.contact], ["#f-cemail", c.email], ["#f-cphone", c.phone], ["#f-caddress", c.address]].forEach(([sel, v]) => { const el = $(sel); if(el) el.value = v || ""; });
    Object.assign(Q.client, {org:c.org, contact:c.contact, email:c.email, phone:c.phone, address:c.address}); close(); keepFocus(viewQuote); toast("Existing client filled in."); };
  ["#f-corg", "#f-ccontact"].forEach(sel => { const el = $(sel); if(!el) return;
    el.setAttribute("role", "combobox"); el.setAttribute("aria-expanded", "false");
    el.addEventListener("input", () => show(el));
    el.addEventListener("focus", () => show(el));
    el.addEventListener("keydown", e => {
      if(list.hidden) return;
      if(e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); active = (active + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; $$("li", list).forEach((li, i) => li.setAttribute("aria-selected", i === active)); el.setAttribute("aria-activedescendant", "ac-" + active); }
      else if(e.key === "Enter" && active >= 0){ e.preventDefault(); pick(active); }
      else if(e.key === "Escape") close();
    });
    el.addEventListener("blur", () => setTimeout(close, 150));
  });
  list.addEventListener("mousedown", e => { const li = e.target.closest("li[data-i]"); if(li){ e.preventDefault(); pick(Number(li.dataset.i)); } });
}

/* illustrated map: sea and coastline, town names, the route as a teal-to-mint line, distance tags,

      <filter id="land" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#5F9A95" flood-opacity=".35"/></filter>
      <style>.tn{font-family:Figtree,Arial,sans-serif;fill:#3F6E70;paint-order:stroke;stroke:#F7FBF9;stroke-width:3.5px;stroke-linejoin:round}.t0{font-size:15px;font-weight:700;fill:#24575A}.t1{font-size:12.5px;font-weight:600}.t2{font-size:11px}

    </defs>

    <path d="${coast}" fill="#F7FBF9" stroke="#9FC6C0" stroke-width="1.3" stroke-linejoin="round" filter="url(#land)"/>
    <path d="${grat}" stroke="#BFD9D5" stroke-width=".7" stroke-dasharray="3 5" fill="none" opacity=".7"/>

    <g transform="translate(${W - 38},38)"><circle r="20" fill="#fff" opacity=".92"/><path d="M0-14L6 6 0 2-6 6Z" fill="#377679"/><text y="16" text-anchor="middle" class="sb">N</text></g>

/* zoom with the mouse wheel around the pointer, drag to pan, buttons for keyboard and touch */
function bindMapZoom(box, r){
  box.style.cursor = "grab";

  let raf = 0;
  const redraw = () => { if(raf) return; raf = requestAnimationFrame(() => { raf = 0; drawSvgMap(box, box._route); }); };
  const toView = (clientX, clientY) => { const rc = box.getBoundingClientRect(), f = Math.max(960 / rc.width, 540 / rc.height) ; const k = Math.min(rc.width / 960, rc.height / 540) ; const s2 = Math.max(rc.width / 960, rc.height / 540);
    return [(clientX - rc.left - (rc.width - 960 * s2) / 2) / s2, (clientY - rc.top - (rc.height - 540 * s2) / 2) / s2]; };
  const zoomAt = (factor, vx, vy) => {
    const v = MAPVIEW; if(!v) return;
    const nsc = Math.min(v.sc0 * 40, Math.max(v.sc0 / 6, v.sc * factor));
    const gx = v.cx + (vx - 480) / v.sc, gy = v.cy - (vy - 270) / v.sc;   // projected point under the pointer

    MAPVIEW.cx = drag.cx - (e.clientX - drag.x) / s2 / MAPVIEW.sc; MAPVIEW.cy = drag.cy + (e.clientY - drag.y) / s2 / MAPVIEW.sc; redraw(); });

  box.addEventListener("pointerup", end); box.addEventListener("pointercancel", end);
  box.addEventListener("dblclick", e => { const [vx, vy] = toView(e.clientX, e.clientY); zoomAt(2, vx, vy); });
  box.addEventListener("click", e => { const b = e.target.closest("[data-z]"); if(!b) return; e.stopPropagation();

    const n = Math.min(60, path.length - 1);

  });

let mlPromise = null;
function loadMapLibre(){
  if(window.maplibregl) return Promise.resolve(window.maplibregl);
  if(!mlPromise) mlPromise = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"; s.onload = () => window.maplibregl ? res(window.maplibregl) : rej(); s.onerror = () => { mlPromise = null; rej(); }; document.head.appendChild(s); });
  return mlPromise;
}
async function drawMapGL(box, r){
  const ml = await withTimeout(loadMapLibre(), 6000);
  if(!document.body.contains(box)) return;
  box.innerHTML = `<div class="gl" id="gl"></div>`;
  if(!$("#ml-css")){ const l = document.createElement("link"); l.id = "ml-css"; l.rel = "stylesheet"; l.href = "https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css"; document.head.appendChild(l); }
  /* basemap as in the MapLibre gradient-line example: OpenFreeMap vector tiles (free, no key, OpenStreetMap data).
     The OpenStreetMap tile servers themselves block apps, which is what showed "Access blocked". */
  const map = new ml.Map({container:"gl", attributionControl:{compact:true}, style:"https://tiles.openfreemap.org/styles/positron"});
  map.addControl(new ml.NavigationControl({showCompass:false}), "top-right");
  map.scrollZoom.enable();
  let errs = 0, loaded = false;
  const fail = () => { try{ map.remove(); }catch(e){} drawSvgMap(box, r); };
  map.on("error", () => { if(++errs === 8 && !loaded) fail(); });
  setTimeout(() => { if(!loaded) fail(); }, 9000);
  map.on("load", () => {
    loaded = true;
    r.journeys.forEach((j, i) => {
      map.addSource("r" + i, {type:"geojson", lineMetrics:true, data:{type:"Feature", geometry:{type:"LineString", coordinates:j.geometry}}});
      map.addLayer({id:"c" + i, type:"line", source:"r" + i, layout:{"line-cap":"round", "line-join":"round"}, paint:{"line-color":"#ffffff", "line-width":["interpolate", ["linear"], ["zoom"], 8, 8, 14, 16]}});
      map.addLayer({id:"l" + i, type:"line", source:"r" + i, layout:{"line-cap":"round", "line-join":"round"},
        paint:{"line-color":"#377679", "line-width":["interpolate", ["linear"], ["zoom"], 8, 5, 14, 11],
          "line-gradient":["interpolate", ["linear"], ["line-progress"], 0, "#1C4547", 0.1, "#24575A", 0.3, "#377679", 0.5, "#20A884", 0.7, "#5FC9A8", 1, "#AAE8D8"]}});
    });
    const pin = (t, bg) => { const el = document.createElement("div"); el.style.cssText = `width:28px;height:28px;border-radius:50%;background:${bg};color:#fff;display:grid;place-items:center;font:700 13px Figtree,Arial;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)`; el.textContent = t; return el; };
    new ml.Marker({element:pin("★", "#1C4547")}).setLngLat([r.start.lon, r.start.lat]).addTo(map);
    let n = 0; r.journeys.forEach(j => j.stops.forEach(s => new ml.Marker({element:pin(++n, "#377679")}).setLngLat([s.lon, s.lat]).addTo(map)));
    const b = new ml.LngLatBounds([r.start.lon, r.start.lat], [r.start.lon, r.start.lat]);
    r.journeys.forEach(j => j.geometry.forEach(c => b.extend(c)));
    map.fitBounds(b, {padding:40, duration:0});
  });
}

        if(g === "vat" && f === "apply") s.vat.apply = v === "true";
        else if(g === "google"){ s.google[f] = v.trim(); if(f === "key"){ gPromise = null; } }
        else if(["lodgement","programme","travelAdj"].includes(g) || (g === "vat" && f === "rate") || (g === "rounding" && f === "to")) s[g][f] = num(v) ?? "";
        else if(g === "travel" && f === "base") s.travel.base = normPC(v);
        else s[g][f] = v; }
      else if(k === "showExpenses") s.showExpenses = v === "true";
      else if(["mileageRate","hourRate","validityDays"].includes(k)) s[k] = num(v) ?? 0; else s[k] = v; }
    else return;
    queueSave();
  };
  const imp = $("#imp"); if(imp) imp.addEventListener("change", async e => {

    catch(err){ toast("That file isn't a pricing export."); }
  });
}

/* ============================================================
   PDF QUOTATION (jsPDF)
   ============================================================ */
let pdfPromise = null;
function loadPdf(){
  if(window.jspdf) return Promise.resolve(window.jspdf);
  if(!pdfPromise) pdfPromise = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"; s.onload = () => window.jspdf ? res(window.jspdf) : rej(new Error("jsPDF missing")); s.onerror = () => { pdfPromise = null; rej(new Error("jsPDF failed to load")); }; document.head.appendChild(s); });
  return pdfPromise;
}
/* quotation PDF: plain and straightforward – letterhead, client and reference, the buildings and services,
   scope, deliverables and programme, then the fees (with any discount shown), terms and acceptance */
async function makePdf(q){
  const {jsPDF} = await withTimeout(loadPdf(), 10000);
  const p = price(q), approved = q.status === "approved" || q.status === "issued";
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const W = 210, M = 20, R = W - M, CW = R - M, INK = [30,36,38], GREY = [105,112,115], LINE = [200,205,207], TEAL = [55,118,121];
  const set = (o = {}) => { doc.setFont("helvetica", o.bold ? "bold" : "normal"); doc.setFontSize(o.size || 9.5); doc.setTextColor(...(o.color || INK)); };
  const txt = (t, x, y, o = {}) => { set(o); doc.text(String(t), x, y, {align:o.align || "left"}); };
  const para = (t, x, y, w, o = {}) => { set(o); const ls = doc.splitTextToSize(String(t), w); doc.text(ls, x, y, {lineHeightFactor:1.4}); return ls.length * (o.size || 9.5) * 0.3528 * 1.4; };
  const hr = (yy, c = LINE, w = 0.25) => { doc.setDrawColor(...c); doc.setLineWidth(w); doc.line(M, yy, R, yy); };
  let y = 0;
  const ensure = h => { if(y + h > 272){ doc.addPage(); y = 22; } };
  const head = t => { ensure(14); txt(t, M, y, {bold:true, size:10.5, color:TEAL}); y += 2; hr(y); y += 5.5; };
  const valid = addDays(q.date || today(), S().validityDays || 30);

  // letterhead
  doc.addImage(LOGO, "PNG", M, 15, 40, 10.2);
  txt(COMPANY.name, R, 16.5, {bold:true, size:9.5, align:"right"});
  txt(COMPANY.address, R, 21, {size:8, color:GREY, align:"right"});
  txt(COMPANY.phone, R, 25, {size:8, color:GREY, align:"right"});
  hr(31, INK, 0.4);

  // title, reference and client
  y = 42;
  txt("Quotation", M, y, {bold:true, size:18});
  if(!approved) txt("DRAFT – not approved", M, y + 6, {bold:true, size:8.5, color:[170,40,30]});
  [["Reference", q.ref || "Draft"], ["Date", fmtD(q.date)], ["Valid until", fmtD(valid)]].forEach(([k, v], i) => { txt(k, R - 55, y - 4 + i * 5.2, {size:8.5, color:GREY}); txt(v, R, y - 4 + i * 5.2, {size:8.8, bold:i === 0, align:"right"}); });
  y += 14;
  txt("To", M, y, {size:8.5, color:GREY}); y += 5;
  [q.client.contact, q.client.org, q.client.address, q.client.email].filter(Boolean).forEach((l, i) => { const h = para(l, M, y, 110, {size:9.5, bold:i === 0}); y += h + 0.6; });
  y += 4;
  txt(q.client.contact ? "Dear " + q.client.contact.split(" ")[0] + "," : "Dear Sir or Madam,", M, y); y += 6;
  y += para("Thank you for your enquiry. Please find our quotation below.", M, y, CW) + 6;

  // buildings and services (no prices)
  head("Buildings and services");
  const C = [M, M + 82, M + 108, M + 140];
  [["Building", C[0]], ["Postcode", C[1]], ["Service", C[2]]].forEach(([t, x]) => txt(t, x, y, {bold:true, size:8.5}));
  txt("Floor area", R, y, {bold:true, size:8.5, align:"right"}); y += 2; hr(y); y += 4.6;
  q.lines.forEach((l, i) => { set({size:9}); const nm = doc.splitTextToSize(l.site || "Building " + (i + 1), C[1] - C[0] - 4); ensure(nm.length * 4.2 + 3);
    doc.text(nm, C[0], y); txt(l.postcode || "–", C[1], y, {size:9}); txt(l.cert === "EPC" ? "EPC" + (l.level === "5" ? " (level 5)" : "") : l.cert, C[2], y, {size:9});
    txt(num(l.area) ? num(l.area).toLocaleString("en-GB") + " sq m" : "–", R, y, {size:9, align:"right"}); y += nm.length * 4.2 + 1.2; hr(y - 2.4, [228,231,232]); y += 1.6; });
  y += 4;

  // scope, deliverables, programme
  const kinds = [...new Set(q.lines.map(l => l.cert))];
  head("Scope of work");
  kinds.forEach(c => { ensure(14); if(kinds.length > 1){ txt(certFull(c), M, y, {bold:true, size:9}); y += 4.6; } y += para(S().scope[c], M, y, CW, {size:9}) + 3; });
  y += 2; head("Deliverables");
  kinds.forEach(c => { const items = S().deliverables[c].split("\n").filter(Boolean); ensure(items.length * 5 + 6);
    if(kinds.length > 1){ txt(certFull(c) + ":", M, y, {bold:true, size:9}); y += 4.8; }
    items.forEach(it => { txt("–", M + 1, y, {size:9}); txt(it, M + 6, y, {size:9}); y += 4.8; }); y += 1.5; });
  y += 2; head("Programme");
  const a1 = num(q.programme.surveyDays) || 0, a2 = num(q.programme.reportDays) || 0;
  [["Site survey", `within ${a1} working days of your instruction`], ["Certificates and reports", `within ${a2} working days of the site survey`]].forEach(([k, v]) => { ensure(6); txt(k, M, y, {size:9, bold:true}); txt(v, M + 48, y, {size:9}); y += 5; });
  if(q.programme.note){ y += para(q.programme.note, M, y + 0.5, CW, {size:8.8, color:GREY}) + 1; }
  y += 5;

  // fees: discount shown; other figures kept to fees, lodgement, VAT and total
  head("Fees");
  ensure(46);
  const row = (k, v, o = {}) => { txt(k, M, y, {size:o.size || 9.5, bold:o.bold, color:o.color}); txt(v, R, y, {size:o.size || 9.5, bold:o.bold, color:o.color, align:"right"}); y += o.gap || 6; };
  row("Professional fees", gbp(r2(p.professional + p.discount)));
  if(p.discount) row(p.disc.source === "manual" ? "Discount (" + p.disc.pct + "%)" : "Quantity discount (" + p.disc.pct + "%)", "–" + gbp(p.discount), {color:TEAL});
  if(p.showExp) row("Expenses", gbp(p.expTotal));
  if(p.lodgement) row("Lodgement fees" + (lodgeText(p) ? " (" + lodgeText(p) + ")" : ""), gbp(p.lodgement));
  hr(y - 3.6); y += 0.8;
  if(S().vat.apply){ row("Total excluding VAT", gbp(p.net), {bold:true}); row("VAT at " + S().vat.rate + "%", gbp(p.vat)); }
  hr(y - 3.6, INK, 0.4); y += 1;
  row(S().vat.apply ? "Total including VAT" : "Total", gbp(p.total), {bold:true, size:11, gap:7});
  set({size:8}); txt("Professional fees cover the site survey, assessment, production of certificates and reports" + (p.travel ? ", and travel" : "") + (p.expTotal && !p.showExp ? ", including expenses" : "") + ".", M, y, {size:8, color:GREY}); y += 8;

  if(q.notes){ head("Notes"); y += para(q.notes, M, y, CW, {size:9}) + 4; }
  head("Terms");
  y += para(S().terms || `This quotation is valid until ${fmtD(valid)}. ${S().vat.apply ? "VAT is charged at the prevailing rate. " : ""}Work starts once we receive your written instruction.`, M, y, CW, {size:8.8}) + 6;

  ensure(48);
  head("Acceptance");
  y += para(`To accept, please sign and return this quotation, or reply by email quoting ${q.ref || "the reference above"}.`, M, y, CW, {size:9}) + 3;
  const line = (label, x, w) => { doc.setDrawColor(...GREY); doc.setLineWidth(0.25); doc.line(x, y + 7, x + w, y + 7); txt(label, x, y + 10.5, {size:7.8, color:GREY}); };
  const half = (CW - 10) / 2; line("Name", M, half); line("Signature", M + half + 10, half); y += 14;
  line("Position", M, half); line("Date", M + half + 10, half); y += 18;
  ensure(18);
  txt("Kind regards,", M, y); y += 9;
  txt(q.preparedBy || "", M, y, {bold:true}); y += 4.6;
  txt("CSR Sustain", M, y, {size:9, color:GREY});

  const pages = doc.getNumberOfPages();
  for(let i = 1; i <= pages; i++){ doc.setPage(i); hr(282);
    txt(COMPANY.reg + "  |  " + COMPANY.email, M, 286.5, {size:7.2, color:GREY});
    txt("Page " + i + " of " + pages, R, 286.5, {size:7.2, color:GREY, align:"right"}); }
  return doc.output("blob");
}
async function downloadPdf(q){
  toast("Preparing the PDF…");
  let blob;
  try{ blob = await makePdf(q); }catch(e){ return toast("The PDF tool couldn't load. Check your internet connection and try again."); }
  const name = (q.ref || "quotation") + " – " + (q.client.org || q.client.contact || "CSR Sustain").replace(/[\\/:*?"<>|]/g, "") + ".pdf";
  try{
    if(window.claude && window.claude.use){
      const dl = await Promise.race([window.claude.use("downloads"), new Promise(r => setTimeout(() => r(null), 1500))]);
      if(dl){ await dl.save({filename:name, data:blob}); return; }
    }
  }catch(e){ if(e && e.code === "declined") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

function summaryText(q){
  const p = price(q), L = [];
  L.push("Quotation " + q.ref + " – " + (q.client.org || q.client.contact));
  L.push("Prepared by " + (q.preparedBy || "–") + " on " + fmtD(q.date)); L.push("");
  p.lines.forEach((x, i) => L.push(x.split
    ? `${i + 1}. ${x.l.cert}${x.col === "epc5" ? " (level 5)" : ""} – ${x.l.site || "Building " + (i + 1)} ${x.l.postcode}: ${x.area} m² split by use${x.l.split.mode === "pct" ? " (estimated)" : ""} – ${x.split.parts.map(pt => (pt.type ? pt.type.type : "?") + " " + pt.area + " m² × " + gbp(pt.rate)).join(" + ")} = ${gbp(x.charge)}`
    : `${i + 1}. ${x.l.cert}${x.col === "epc5" ? " (level 5)" : ""} – ${x.l.site || "Building " + (i + 1)} ${x.l.postcode}: ${x.area} m² × ${gbp(x.rate)}${x.overridden ? " (rate changed: " + x.l.reason + ")" : ""} = ${gbp(x.charge)}`));
  p.expenses.forEach(x => L.push(`${x.e.type}${x.e.desc ? " (" + x.e.desc + ")" : ""}: ${x.e.qty} × ${gbp(num(x.e.unit) || 0)} = ${gbp(x.amount)}`));
  if(p.discount) L.push(p.disc.label + " on card rates: −" + gbp(p.discount));
  L.push(`Travel: ${p.tf.miles.toFixed(1)} miles × £${S().mileageRate} = ${gbp(p.mileage)}; ${hm(p.tf.hours)} × £${S().hourRate} = ${gbp(p.time)}`);
  L.push("Lodgement fees: " + gbp(p.lodgement));
  L.push("Rounding: " + gbp(p.rounding)); L.push("");
  L.push("Price before VAT " + gbp(p.net)); if(S().vat.apply) L.push("Total including VAT " + gbp(p.total));
  L.push("Programme: survey within " + q.programme.surveyDays + " working days, certificates within " + q.programme.reportDays + " working days of survey");
  return L.join("\n");
}
function mail(to, subject, body){ const a = document.createElement("a"); a.href = "mailto:" + encodeURIComponent(to) + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body); a.target = "_top"; document.body.appendChild(a); a.click(); a.remove(); }

function confirmDlg(title, text, yes, onYes, danger){
  const sc = document.createElement("div"); sc.className = "scrim";
  sc.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><div class="dlg-h"><h2 id="dlg-t">${esc(title)}</h2><button class="x" aria-label="Close">×</button></div><div class="dlg-b"><p style="margin:0">${esc(text)}</p></div><div class="dlg-f"><button class="btn" data-no>Cancel</button><button class="btn ${danger ? "danger" : "primary"}" data-yes>${esc(yes)}</button></div></div>`;
  document.body.appendChild(sc);
  const prev = document.activeElement, close = () => { sc.remove(); document.removeEventListener("keydown", key); if(prev && prev.focus) prev.focus(); };
  const key = e => { if(e.key === "Escape") close(); };
  document.addEventListener("keydown", key);
  $(".x", sc).onclick = close; $("[data-no]", sc).onclick = close; sc.onmousedown = e => { if(e.target === sc) close(); };
  $("[data-yes]", sc).onclick = () => { close(); onYes(); };
  $("[data-yes]", sc).focus();
}
